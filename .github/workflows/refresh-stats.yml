name: Refresh stats images

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stat cards with retries
        run: |
          mkdir -p assets
          fetch() {
            url="$1"; out="$2"
            for i in $(seq 1 10); do
              if curl -sfL "$url" -o "$out.tmp" && grep -q "<svg" "$out.tmp"; then
                mv "$out.tmp" "$out"
                echo "fetched $out"
                return 0
              fi
              echo "attempt $i failed for $out, retrying in 30s"
              sleep 30
            done
            echo "giving up on $out, keeping previous version"
            rm -f "$out.tmp"
            return 0
          }
          base="https://github-readme-stats.vercel.app"
          fetch "$base/api?username=acheamponge&show_icons=true&theme=default&hide_border=true&rank_icon=github" assets/stats-light.svg
          fetch "$base/api?username=acheamponge&show_icons=true&theme=github_dark&hide_border=true&rank_icon=github" assets/stats-dark.svg
          fetch "$base/api/top-langs/?username=acheamponge&layout=compact&theme=default&hide_border=true&langs_count=8" assets/langs-light.svg
          fetch "$base/api/top-langs/?username=acheamponge&layout=compact&theme=github_dark&hide_border=true&langs_count=8" assets/langs-dark.svg
          fetch "https://streak-stats.demolab.com?user=acheamponge&theme=default&hide_border=true" assets/streak-light.svg
          fetch "https://streak-stats.demolab.com?user=acheamponge&theme=dark&hide_border=true" assets/streak-dark.svg

      - name: Commit updated images
        run: |
          git config user.name "acheamponge"
          git config user.email "achampion.emma@gmail.com"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh stats images"
          git push
